<section class="dashboard-kpi-strip" [class.dashboard-kpi-strip--fluid]="fluid" [attr.aria-label]="'MEDICAL_RECORDS.OPERATIONS_HOME.INDICATORS' | translate">
    <article
        class="dashboard-kpi-strip__item"
        *ngFor="let widgetId of widgetIds; trackBy: trackByWidgetId"
        [class.is-selected]="isSelected(widgetId)"
        [class.dashboard-kpi-strip__item--wide]="widgets[widgetId]?.type === 'provider-cards'"
        [class.edit-mode]="editMode"
        (click)="onSelect(widgetId, $event)"
    >
        <ng-container *ngIf="widgets[widgetId] as widgetConfig">
            <medical-records-dashboard-metric-widget
                *ngIf="widgetConfig.type === 'metric'"
                [config]="widgetConfig"
                [compact]="true"
                [headerKpi]="true"
                [pageActive]="pageActive"
            ></medical-records-dashboard-metric-widget>

            <medical-records-dashboard-gauge-widget
                *ngIf="widgetConfig.type === 'gauge'"
                [config]="widgetConfig"
                [headerKpi]="true"
                [pageActive]="pageActive"
            ></medical-records-dashboard-gauge-widget>
            <medical-records-dashboard-provider-cards-widget
                *ngIf="widgetConfig.type === 'provider-cards'"
                [config]="widgetConfig"
                [pageActive]="pageActive"
                (providerSelected)="providerSelected.emit($event)"
            ></medical-records-dashboard-provider-cards-widget>
        </ng-container>
    </article>
</section>
