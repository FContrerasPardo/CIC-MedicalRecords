<p class="dashboard-overview__loading" *ngIf="layoutLoading">

    {{ 'MEDICAL_RECORDS.DASHBOARD.LOADING_LAYOUT' | translate }}

</p>



<p class="dashboard-overview__loading" *ngIf="!layoutLoading && !pages.length">
    {{ 'MEDICAL_RECORDS.OPERATIONS_HOME.EMPTY_LAYOUT' | translate }}
</p>

<medical-records-dashboard-widget-grid

    *ngIf="!layoutLoading"

    [pages]="pages"

    [activePageId]="activePageId"

    [widgets]="widgets"

    [theme]="theme"

    [operationsMode]="operationsMode"

    (processSelected)="onProcessSelected($event)"

    (activePageChange)="onActivePageChange($event)"

></medical-records-dashboard-widget-grid>
