<section class="operations-home" aria-labelledby="operations-home-title">
    <header class="operations-home__header">
        <div class="operations-home__intro">
            <h1 id="operations-home-title">{{ 'MEDICAL_RECORDS.OPERATIONS_HOME.TITLE' | translate }}</h1>
            <p>{{ 'MEDICAL_RECORDS.OPERATIONS_HOME.SUBTITLE' | translate }}</p>
        </div>
        <div class="operations-home__actions">
            <a routerLink="/medical-records/agreements" class="operations-home__configure">
                {{ 'MEDICAL_RECORDS.TOP_LINKS.AGREEMENTS' | translate }}
            </a>
            <a routerLink="/medical-records/configure" class="operations-home__configure">
                <span class="material-icons" aria-hidden="true">tune</span>
                {{ 'MEDICAL_RECORDS.DASHBOARD.EDIT_DASHBOARD' | translate }}
            </a>
            <button type="button" class="operations-home__start" (click)="startAccount.emit()">
                <span class="material-icons" aria-hidden="true">add</span>
                {{ 'MEDICAL_RECORDS.OPERATIONS_HOME.START_ACCOUNT' | translate }}
            </button>
        </div>
    </header>

    <ng-template #afterKpi>
        <medical-records-operations-distribution-band></medical-records-operations-distribution-band>
    </ng-template>

    <medical-records-dashboard-overview [operationsMode]="true" [afterKpiTemplate]="afterKpi"></medical-records-dashboard-overview>
</section>
